name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # 'github' reporter (used in CI, see playwright.config.ts) doesn't
          # write playwright-report/ — the actual/expected/diff images for a
          # failed toHaveScreenshot() land in test-results/ instead.
          path: test-results/
          retention-days: 7

  # Manually triggered: (re)generates tests/e2e/__screenshots__ on this same
  # runner image, so the baselines are pixel-matched to what CI itself will
  # later compare against — see docs/BUILD_BRIEF.md step 4. Run this after
  # any change that legitimately alters /states' rendering, then download
  # the 'updated-screenshots' artifact and commit it over the old baselines.
  update-screenshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # =all, not the default (=changed): toHaveScreenshot's per-pixel colour
      # tolerance can pass a real colour change (step 8: offline cyan -> steel
      # passed at ~1000 differing pixels), and =changed only rewrites failing
      # snapshots — it would silently keep the old image. Unchanged fixtures
      # come out byte-identical on this runner; commit only the ones that differ.
      - run: npx playwright test --update-snapshots=all
      - uses: actions/upload-artifact@v4
        with:
          name: updated-screenshots
          path: tests/e2e/__screenshots__/
          retention-days: 7
